<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocalis | Talk to the agent</title><style>
:root{font-family:system-ui,sans-serif;color:#edf1f7;background:#0b1220}body{margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(720px,92vw);background:#142036;border:1px solid #34445f;border-radius:20px;padding:28px}h1{margin-top:0}#log{height:340px;overflow:auto;background:#0c1629;border-radius:12px;padding:16px;margin:16px 0}.msg{margin:10px 0}.you{color:#8bd3ff}.agent{color:#a5efc7}.system{color:#d1c795}form{display:flex;gap:8px}input{flex:1}input,button{border:1px solid #526582;border-radius:10px;padding:12px;background:#182842;color:white}button{cursor:pointer}button:disabled{opacity:.5}small{color:#aebbd0}#mic.recording{background:#a52f52}</style></head><body><main><h1>Talk to Vocalis</h1><p>Browser voice demo. Responses and timing reflect this session. The microphone sends up to 30 seconds of audio per turn.</p><div id="status">Connecting…</div><div id="log" aria-live="polite"></div><form id="form"><input id="text" maxlength="2000" placeholder="Ask a question" aria-label="Message"><button>Send</button></form><p><button id="mic" type="button">Hold to talk</button> <button id="stop" type="button">Interrupt</button></p><small id="metrics">No measured turns yet.</small></main><script>
let ws, audio, recording=false, chunks=[], stream, context, processor, source, currentTurn=0;
const log=document.querySelector('#log'); const status=document.querySelector('#status');
function line(kind,text){const div=document.createElement('div');div.className='msg '+kind;div.textContent=(kind==='you'?'You: ':kind==='agent'?'Vocalis: ':'')+text;log.appendChild(div);log.scrollTop=log.scrollHeight;}
function stopAudio(){if(audio){audio.pause();audio.src='';audio=null;}}
function connect(){const scheme=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(scheme+'://'+location.host+'/ws/demo');ws.onopen=()=>status.textContent='Connected';ws.onclose=()=>{status.textContent='Disconnected. Reconnecting…';setTimeout(connect,2500)};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='ready')line('system',m.text);if(m.type==='cancel_audio'){currentTurn=m.turn_id;stopAudio()}if(m.type==='transcription')line('you',m.text);if(m.type==='response'&&m.turn_id===currentTurn){line('agent',m.text);document.querySelector('#metrics').textContent='Server response: '+m.metrics.end_to_end_response_ms+' ms';}if(m.type==='audio'&&m.turn_id===currentTurn){const bytes=Uint8Array.from(atob(m.audio),c=>c.charCodeAt(0));audio=new Audio(URL.createObjectURL(new Blob([bytes],{type:'audio/mpeg'})));audio.play().catch(()=>line('system','Audio playback was blocked.'));audio.onended=()=>{URL.revokeObjectURL(audio.src);audio=null}}if(m.type==='error')line('system',m.text)}}
function send(type,payload){if(ws?.readyState!==1){line('system','Connection unavailable.');return}stopAudio();ws.send(JSON.stringify({type,...payload}))}
document.querySelector('#form').onsubmit=e=>{e.preventDefault();const field=document.querySelector('#text');const value=field.value.trim();if(value){line('you',value);send('text',{text:value});field.value=''}};
document.querySelector('#stop').onclick=()=>send('interrupt',{});
const mic=document.querySelector('#mic');async function start(){if(recording)return;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});context=new AudioContext();source=context.createMediaStreamSource(stream);processor=context.createScriptProcessor(4096,1,1);chunks=[];processor.onaudioprocess=e=>{if(recording){const samples=e.inputBuffer.getChannelData(0),out=new Int16Array(samples.length);for(let i=0;i<samples.length;i++)out[i]=Math.max(-32768,Math.min(32767,Math.round(samples[i]*32767)));chunks.push(out)}};source.connect(processor);processor.connect(context.destination);recording=true;mic.classList.add('recording');stopAudio();send('interrupt',{});}catch(e){line('system','Microphone access failed. Use a secure origin or localhost.')}}
function finish(){if(!recording)return;recording=false;mic.classList.remove('recording');processor.disconnect();source.disconnect();stream.getTracks().forEach(t=>t.stop());const count=chunks.reduce((n,c)=>n+c.length,0);const merged=new Int16Array(count);let at=0;for(const c of chunks){merged.set(c,at);at+=c.length}if(count>0&&count/context.sampleRate<=30){let s='';const bytes=new Uint8Array(merged.buffer);for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.subarray(i,i+8192));send('audio',{audio:btoa(s),sample_rate:context.sampleRate})}else if(count)line('system','Recording must be 30 seconds or shorter.');context.close()}
mic.addEventListener('pointerdown',start);window.addEventListener('pointerup',finish);mic.addEventListener('keydown',e=>{if(e.code==='Space')start()});mic.addEventListener('keyup',e=>{if(e.code==='Space')finish()});connect();
</script></body></html>
